name: Deploy Frontend To Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: deans-filing-system
  REGION: asia-northeast1
  WIF_PROVIDER: projects/463695708385/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT: github-actions-deployer@deans-filing-system.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ohwa-frontend-runtime@deans-filing-system.iam.gserviceaccount.com
  SERVICE_NAME: ohwa-deans-filing-system
  BACKEND_SERVICE_NAME: deans-server
  VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
  VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
  VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe cloud-run \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create cloud-run \
              --project "$PROJECT_ID" \
              --location "$REGION" \
              --repository-format docker
          fi

      - name: Configure Docker auth for Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve backend URL
        id: backend
        run: |
          set -euo pipefail
          backend_url="$(gcloud run services describe "${BACKEND_SERVICE_NAME}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          [ -n "$backend_url" ] || { echo "Unable to resolve backend URL" >&2; exit 1; }

          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend service
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-env-vars "VITE_API_BASE_URL=${{ steps.backend.outputs.backend_url }},VITE_EMAILJS_SERVICE_ID=${VITE_EMAILJS_SERVICE_ID},VITE_EMAILJS_TEMPLATE_ID=${VITE_EMAILJS_TEMPLATE_ID},VITE_EMAILJS_PUBLIC_KEY=${VITE_EMAILJS_PUBLIC_KEY}" \
            --quiet
